apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ml-app.fullname" . }}-config
  labels:
    {{- include "ml-app.labels" . | nindent 4 }}
data:
  REDIS_HOST: {{ .Values.env.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.env.REDIS_PORT | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.env.KAFKA_BOOTSTRAP_SERVERS | quote }}
  INFERENCE_REQUESTS_TOPIC: {{ .Values.env.INFERENCE_REQUESTS_TOPIC | quote }}
  INFERENCE_RESULTS_TOPIC: {{ .Values.env.INFERENCE_RESULTS_TOPIC | quote }}

# Default values for ml-app workload.

replicaCount: 2

image:
  repository: ghcr.io/mastershantash/project-one/ml-serving-capstone
  pullPolicy: Always
  tag: "sha-c0a5d5d"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Zero-Dollar Ingress Routing & Rate Limiting
ingress:
  enabled: true
  rateLimitRps: 100
  path: /
  annotations: {}

# Zero-Dollar High Availability Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Zero-Dollar Dedicated Kafka Streaming Worker Deployment
worker:
  enabled: true
  replicaCount: 1

# Cross-Namespace DNS routing to shared ml-infra platform
env:
  REDIS_HOST: "redis-service.ml-infra"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.ml-infra:9092"
  INFERENCE_REQUESTS_TOPIC: "inference-requests"
  INFERENCE_RESULTS_TOPIC: "inference-results"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5

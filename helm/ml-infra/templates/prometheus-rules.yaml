{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  labels:
    app: prometheus
    app.kubernetes.io/part-of: ml-infra
data:
  alerts.yml: |
    groups:
      - name: mlops-service-alerts
        rules:
          - alert: HighInferenceLatency
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler="/predict"}[2m])) by (le)) > 0.5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High ML inference latency on {{ `{{ $labels.instance }}` }}"
              description: "95th percentile latency exceeds 500ms for over 1 minute."

          - alert: HighHttpErrorRate
            expr: sum(rate(http_requests_total{status=~"5.."}[2m])) / sum(rate(http_requests_total[2m])) > 0.05
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx error rate on ML Serving API"
              description: "HTTP 5xx error rate exceeds 5% of total requests."

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 > 2
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ `{{ $labels.pod }}` }} is crash looping"
              description: "Pod has restarted more than 2 times in the last 5 minutes."
{{- end }}
